<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRM SEARCH — Litigator APR Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7f6;min-height:100vh}
.header{background:linear-gradient(135deg,#1B4D3E 0%,#25654f 100%);padding:16px 28px;color:#fff;display:flex;align-items:center;gap:16px}
.header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
.header p{margin-top:3px;font-size:12px;opacity:.75}
.header .save-status{font-size:12px;opacity:.9;margin-left:auto}
.tab-bar{display:flex;border-bottom:2px solid #e2e6ec;background:#fff;padding:0 24px;align-items:center;flex-wrap:wrap;gap:4px}
.tab-btn{padding:12px 24px;border:none;background:none;cursor:pointer;font-size:14px;color:#666;border-bottom:3px solid transparent;font-family:inherit}
.tab-btn.active{font-weight:700;color:#1B4D3E;border-bottom-color:#1B4D3E}
.tab-spacer{flex:1}
.tab-info{font-size:12px;color:#888;margin-right:12px}
.toolbar-btn{padding:6px 14px;background:#1B4D3E;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:600;font-size:12px;font-family:inherit}
.toolbar-btn:disabled{opacity:.5;cursor:default}
.toolbar-group{display:flex;gap:6px}
.content{padding:24px}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.section-title{margin:0 0 12px;font-size:18px;color:#1B4D3E;display:flex;align-items:center;gap:8px}
.add-btn{padding:8px 18px;background:#1B4D3E;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.table-wrap{overflow-x:auto;margin-bottom:24px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{padding:8px 6px;background:#1B4D3E;color:#fff;font-weight:600;text-align:left;white-space:nowrap;border-bottom:2px solid #143b2f;cursor:pointer;user-select:none;position:sticky;top:0}
td{padding:4px 5px;border-bottom:1px solid #e2e6ec}
.sc-th{text-align:center}
.sc-td{text-align:center;padding:8px}
.sc-name{text-align:left;font-weight:600;color:#1B4D3E;padding:8px}
.apr-val{font-weight:700;font-size:14px}
input[type="text"],input[type="number"],input[type="date"],select{padding:5px 6px;border:1px solid #cdd3dc;border-radius:4px;font-size:13px;font-family:inherit}
input[type="text"]{width:100%;min-width:90px}
input[type="date"]{width:140px}
input[type="number"]{width:100px;text-align:right}
input.narrow{width:70px}
select{background:#fff}
.del-btn{background:none;border:none;color:#c0392b;cursor:pointer;font-size:16px;font-weight:700;padding:2px 6px}
.duration{font-weight:600;color:#2c3e50;min-width:50px;display:inline-block;text-align:center}
.badge{color:#fff;border-radius:4px;padding:3px 10px;font-weight:700;display:inline-block;font-size:12px}
.badge-strong{background:#27ae60}
.badge-review{background:#c0392b}
.badge-grey{background:#7f8c8d}
.empty-msg{text-align:center;color:#888;padding:32px}
.import-msg{margin:12px 24px 0;padding:10px 16px;border-radius:6px;font-size:13px}
.import-success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.import-error{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.row-even{background:#fff}
.row-odd{background:#f8f9fb}
.sc-row-even{background:#fff}
.sc-row-odd{background:#f8faf9}
#file-input{display:none}
.flex-row{display:flex;align-items:center;margin-bottom:12px}
.flex-row .section-title{flex:1}
</style>
<meta name="theme-color" content="#1a2b4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APR Calculator">
</head>
<body>

<div class="header">
  <div style="flex:1">
    <h1>GRM SEARCH &#8212; Litigator APR Calculator</h1>
    <p>Closed-matter analytics &amp; attorney scoring</p>
  </div>
  <span class="save-status" id="saveStatus"></span>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tabMatter" onclick="switchTab('matter')">Matter Entry</button>
  <button class="tab-btn" id="tabScorecard" onclick="switchTab('scorecard')">Attorney Scorecard</button>
  <div class="tab-spacer"></div>
  <span class="tab-info" id="tabInfo"></span>
  <div class="toolbar-group" id="matterToolbar">
    <input type="file" id="file-input" accept=".csv">
    <button class="toolbar-btn" onclick="document.getElementById('file-input').click()">&#11014; Import CSV</button>
    <button class="toolbar-btn" id="exportMattersBtn" onclick="exportMattersCSV()" disabled>&#11015; Export CSV</button>
  </div>
  <div class="toolbar-group" id="scorecardToolbar" style="display:none">
    <button class="toolbar-btn" id="exportScorecardBtn" onclick="exportScorecardCSV()" disabled>&#11015; Export Scorecard</button>
  </div>
</div>

<div id="importMsg"></div>

<div class="content">
  <div class="card">
    <div id="matterView">
      <div class="flex-row">
        <h2 class="section-title">&#128203; Matter Entry Table</h2>
        <button class="add-btn" onclick="addMatter()">+ Add Matter</button>
      </div>
      <div class="table-wrap">
        <table id="matterTable">
          <thead><tr id="matterHead"></tr></thead>
          <tbody id="matterBody"></tbody>
        </table>
      </div>
    </div>
    <div id="scorecardView" style="display:none">
      <h2 class="section-title">&#128202; Attorney Scorecard</h2>
      <div class="table-wrap">
        <table id="scorecardTable">
          <thead><tr id="scorecardHead"></tr></thead>
          <tbody id="scorecardBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// === Constants ===
var MATTER_TYPES = ['Commercial Litigation','Employment Dispute','Regulatory Investigation','Appeal','Contract Dispute','Class Action','Injunction / Interim Relief','Arbitration'];
var DIFFICULTY_BANDS = ['Low','Medium','High'];
var STORAGE_KEY = 'grm_apr_matters';
var COLS = [
  {key:'Matter_ID',label:'Matter ID',type:'text'},
  {key:'Attorney_Name',label:'Attorney Name',type:'text'},
  {key:'Matter_Type',label:'Matter Type',type:'select',opts:MATTER_TYPES},
  {key:'Open_Date',label:'Open Date',type:'date'},
  {key:'Close_Date',label:'Close Date',type:'date'},
  {key:'Duration_Days',label:'Duration (Days)',type:'readonly'},
  {key:'Expected_Outcome_Value',label:'Expected Outcome (R)',type:'currency'},
  {key:'Actual_Outcome_Value',label:'Actual Outcome (R)',type:'currency'},
  {key:'Budgeted_Net_Value',label:'Budgeted Net (R)',type:'currency'},
  {key:'Actual_Legal_Spend',label:'Actual Spend (R)',type:'currency'},
  {key:'Difficulty_Band',label:'Difficulty',type:'select',opts:DIFFICULTY_BANDS},
  {key:'Procedural_Errors_Count',label:'Proc. Errors',type:'int'}
];
var SC_HEADERS = ['Attorney','#Matters','LOI','CTE','BPI','PER','APR','APR Band'];
var MATTER_CSV_HEADERS = ['Matter_ID','Attorney_Name','Matter_Type','Open_Date','Close_Date','Duration_Days','Expected_Outcome_Value','Actual_Outcome_Value','Budgeted_Net_Value','Actual_Legal_Spend','Difficulty_Band','Procedural_Errors_Count'];
var SC_CSV_HEADERS = ['Attorney_Name','Matter_Count','LOI','CTE','BPI','PER','APR','APR_Band'];
var NUM_KEYS = ['Expected_Outcome_Value','Actual_Outcome_Value','Budgeted_Net_Value','Actual_Legal_Spend','Procedural_Errors_Count'];

// === State ===
var matters = [];
var sortCol = null;
var sortAsc = true;
var counter = 0;
var saveTimer = null;
var currentTab = 'matter';

// === Helpers ===
function calcDuration(open, close) {
  if (!open || !close) return 0;
  var d = (new Date(close).getTime() - new Date(open).getTime()) / 86400000;
  return d > 0 ? Math.round(d) : 0;
}

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

function computeScorecard() {
  var grouped = {};
  for (var i = 0; i < matters.length; i++) {
    var m = matters[i];
    var name = (m.Attorney_Name || '').trim();
    if (!name) continue;
    if (!grouped[name]) grouped[name] = [];
    grouped[name].push(m);
  }
  var results = [];
  var keys = Object.keys(grouped);
  for (var k = 0; k < keys.length; k++) {
    var nm = keys[k], ms = grouped[nm], n = ms.length;
    var sumActual=0,sumExpected=0,sumDuration=0,sumBudgeted=0,sumSpend=0,sumErrors=0;
    for (var j = 0; j < ms.length; j++) {
      sumActual += ms[j].Actual_Outcome_Value;
      sumExpected += ms[j].Expected_Outcome_Value;
      sumDuration += ms[j].Duration_Days;
      sumBudgeted += ms[j].Budgeted_Net_Value;
      sumSpend += ms[j].Actual_Legal_Spend;
      sumErrors += ms[j].Procedural_Errors_Count;
    }
    var LOI = sumExpected ? sumActual / sumExpected : 0;
    var CTE = sumDuration ? (90 * n) / sumDuration : 0;
    var BPI = sumSpend ? sumBudgeted / sumSpend : 0;
    var PER = n ? sumErrors / n : 0;
    var a = clamp((LOI - 0.7) * 3.5, 0, 2.375);
    var b = clamp((CTE - 0.6) * 2.7, 0, 2.375);
    var c = clamp((BPI - 0.5) * 2.5, 0, 2.375);
    var d = clamp(2.375 - PER * 12, 0, 2.375);
    var APR = ((a + b + c + d) / 6) * 100;
    var APR_Band;
    if (n < 10) APR_Band = 'Insufficient data';
    else if (APR >= 100) APR_Band = 'Strong';
    else APR_Band = 'Needs Review';
    results.push({Attorney_Name:nm,Matter_Count:n,LOI:LOI,CTE:CTE,BPI:BPI,PER:PER,a:a,b:b,c:c,d:d,APR:APR,APR_Band:APR_Band});
  }
  return results;
}

function newMatter() {
  return {
    id:'m-'+(++counter)+'-'+Date.now(),
    Matter_ID:'',Attorney_Name:'',Matter_Type:MATTER_TYPES[0],
    Open_Date:'',Close_Date:'',Duration_Days:0,
    Expected_Outcome_Value:0,Actual_Outcome_Value:0,
    Budgeted_Net_Value:0,Actual_Legal_Spend:0,
    Difficulty_Band:DIFFICULTY_BANDS[0],Procedural_Errors_Count:0
  };
}

// === Persistence ===
function saveToDisk() {
  if (saveTimer) clearTimeout(saveTimer);
  document.getElementById('saveStatus').textContent = '\uD83D\uDCBE Saving\u2026';
  saveTimer = setTimeout(function() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(matters));
      document.getElementById('saveStatus').textContent = '\u2705 Saved';
      setTimeout(function() { document.getElementById('saveStatus').textContent = ''; }, 2000);
    } catch(e) {
      document.getElementById('saveStatus').textContent = '\u26A0\uFE0F Save failed';
    }
  }, 400);
}

function loadFromDisk() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    matters = arr.map(function(m) {
      var base = newMatter();
      for (var key in m) { if (Object.prototype.hasOwnProperty.call(m, key)) base[key] = m[key]; }
      NUM_KEYS.forEach(function(k) { base[k] = num(base[k]); });
      base.Duration_Days = calcDuration(base.Open_Date, base.Close_Date);
      return base;
    });
  } catch(e) { matters = []; }
}

// === Tabs ===
function switchTab(tab) {
  currentTab = tab;
  var isMatter = tab === 'matter';
  document.getElementById('tabMatter').className = 'tab-btn' + (isMatter ? ' active' : '');
  document.getElementById('tabScorecard').className = 'tab-btn' + (isMatter ? '' : ' active');
  document.getElementById('matterView').style.display = isMatter ? '' : 'none';
  document.getElementById('scorecardView').style.display = isMatter ? 'none' : '';
  document.getElementById('matterToolbar').style.display = isMatter ? '' : 'none';
  document.getElementById('scorecardToolbar').style.display = isMatter ? 'none' : '';
  render();
}

function render() {
  if (currentTab === 'matter') renderMatters(); else renderScorecard();
  updateInfo();
}

function updateInfo() {
  var n = matters.length;
  var attorneys = computeScorecard().length;
  document.getElementById('tabInfo').textContent = n + ' matter' + (n === 1 ? '' : 's') + ' \u00B7 ' + attorneys + ' attorney' + (attorneys === 1 ? '' : 's');
  document.getElementById('exportMattersBtn').disabled = n === 0;
  document.getElementById('exportScorecardBtn').disabled = attorneys === 0;
}

// === Matter table ===
function renderMatters() {
  var head = document.getElementById('matterHead');
  var h = '';
  COLS.forEach(function(c) {
    var arrow = sortCol === c.key ? (sortAsc ? ' \u25B2' : ' \u25BC') : '';
    h += '<th onclick="sortBy(\'' + c.key + '\')">' + esc(c.label) + arrow + '</th>';
  });
  head.innerHTML = h + '<th style="cursor:default"></th>';

  var body = document.getElementById('matterBody');
  if (!matters.length) {
    body.innerHTML = '<tr><td colspan="' + (COLS.length + 1) + '" class="empty-msg">No matters yet. Click &ldquo;+ Add Matter&rdquo; or import a CSV.</td></tr>';
    return;
  }
  var rows = matters.slice();
  if (sortCol) {
    rows.sort(function(a, b) {
      var x = a[sortCol], y = b[sortCol];
      if (typeof x === 'string') { x = x.toLowerCase(); y = String(y).toLowerCase(); }
      return (x < y ? -1 : x > y ? 1 : 0) * (sortAsc ? 1 : -1);
    });
  }
  var html = '';
  rows.forEach(function(m, i) {
    html += '<tr class="' + (i % 2 ? 'row-odd' : 'row-even') + '">';
    COLS.forEach(function(c) {
      var v = m[c.key], id = esc(m.id), h2 = '';
      var ev = 'onchange="updateField(\'' + id + '\',\'' + c.key + '\',this.value)"';
      if (c.type === 'text') {
        h2 = '<input type="text" value="' + esc(v) + '" ' + ev + '>';
      } else if (c.type === 'date') {
        h2 = '<input type="date" value="' + esc(v) + '" ' + ev + '>';
      } else if (c.type === 'select') {
        h2 = '<select ' + ev + '>' + c.opts.map(function(o) {
          return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
      } else if (c.type === 'readonly') {
        h2 = '<span class="duration" id="dur-' + id + '">' + v + '</span>';
      } else if (c.type === 'currency') {
        h2 = '<input type="number" min="0" step="1000" value="' + v + '" ' + ev + '>';
      } else {
        h2 = '<input type="number" class="narrow" min="0" step="1" value="' + v + '" ' + ev + '>';
      }
      html += '<td>' + h2 + '</td>';
    });
    html += '<td><button class="del-btn" title="Delete matter" onclick="deleteMatter(\'' + esc(m.id) + '\')">&times;</button></td></tr>';
  });
  body.innerHTML = html;
}

function sortBy(key) {
  if (sortCol === key) sortAsc = !sortAsc; else { sortCol = key; sortAsc = true; }
  renderMatters();
}

function addMatter() {
  matters.push(newMatter());
  saveToDisk();
  render();
}

function deleteMatter(id) {
  matters = matters.filter(function(m) { return m.id !== id; });
  saveToDisk();
  render();
}

function updateField(id, key, val) {
  for (var i = 0; i < matters.length; i++) {
    if (matters[i].id !== id) continue;
    var m = matters[i];
    m[key] = NUM_KEYS.indexOf(key) >= 0 ? Math.max(0, num(val)) : val;
    if (key === 'Open_Date' || key === 'Close_Date') {
      m.Duration_Days = calcDuration(m.Open_Date, m.Close_Date);
      var el = document.getElementById('dur-' + id);
      if (el) el.textContent = m.Duration_Days;
    }
    break;
  }
  saveToDisk();
  updateInfo();
}

// === Scorecard ===
function renderScorecard() {
  document.getElementById('scorecardHead').innerHTML = SC_HEADERS.map(function(t, i) {
    return '<th class="sc-th" style="cursor:default;' + (i === 0 ? 'text-align:left' : '') + '">' + t + '</th>';
  }).join('');
  var body = document.getElementById('scorecardBody');
  var data = computeScorecard().sort(function(a, b) { return b.APR - a.APR; });
  if (!data.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty-msg">Add matters with an attorney name to see scores.</td></tr>';
    return;
  }
  var html = '';
  data.forEach(function(r, i) {
    var cls = r.APR_Band === 'Strong' ? 'badge-strong' : r.APR_Band === 'Needs Review' ? 'badge-review' : 'badge-grey';
    html += '<tr class="' + (i % 2 ? 'sc-row-odd' : 'sc-row-even') + '">' +
      '<td class="sc-name">' + esc(r.Attorney_Name) + '</td>' +
      '<td class="sc-td">' + r.Matter_Count + '</td>' +
      '<td class="sc-td">' + r.LOI.toFixed(2) + '</td>' +
      '<td class="sc-td">' + r.CTE.toFixed(2) + '</td>' +
      '<td class="sc-td">' + r.BPI.toFixed(2) + '</td>' +
      '<td class="sc-td">' + r.PER.toFixed(2) + '</td>' +
      '<td class="sc-td apr-val">' + r.APR.toFixed(1) + '</td>' +
      '<td class="sc-td"><span class="badge ' + cls + '">' + r.APR_Band + '</span></td></tr>';
  });
  body.innerHTML = html;
}

// === CSV export ===
function csvCell(v) {
  var s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCSV(filename, headers, rows) {
  var lines = [headers.join(',')];
  rows.forEach(function(r) { lines.push(headers.map(function(h) { return csvCell(r[h]); }).join(',')); });
  var blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

function today() { return new Date().toISOString().slice(0, 10); }

function exportMattersCSV() {
  if (!matters.length) return;
  downloadCSV('grm_matters_' + today() + '.csv', MATTER_CSV_HEADERS, matters);
}

function exportScorecardCSV() {
  var data = computeScorecard().sort(function(a, b) { return b.APR - a.APR; });
  if (!data.length) return;
  data = data.map(function(r) {
    return {Attorney_Name:r.Attorney_Name,Matter_Count:r.Matter_Count,LOI:r.LOI.toFixed(4),CTE:r.CTE.toFixed(4),BPI:r.BPI.toFixed(4),PER:r.PER.toFixed(4),APR:r.APR.toFixed(2),APR_Band:r.APR_Band};
  });
  downloadCSV('grm_scorecard_' + today() + '.csv', SC_CSV_HEADERS, data);
}

// === CSV import ===
function parseCSV(text) {
  var rows = [], row = [], cell = '', inQ = false;
  text = text.replace(/^\uFEFF/, '');
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell);
  if (row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}

function showMsg(text, ok) {
  document.getElementById('importMsg').innerHTML = '<div class="import-msg ' + (ok ? 'import-success' : 'import-error') + '">' + esc(text) + '</div>';
  setTimeout(function() { document.getElementById('importMsg').innerHTML = ''; }, 8000);
}

function importCSVText(text) {
  var rows = parseCSV(text);
  if (rows.length < 2) { showMsg('That file has no data rows.', false); return; }
  var header = rows[0].map(function(h) { return h.trim(); });
  var missing = ['Attorney_Name'].filter(function(h) { return header.indexOf(h) < 0; });
  if (missing.length) { showMsg('Missing required column: ' + missing.join(', ') + '. Use an exported file as a template.', false); return; }
  var added = 0, skipped = 0;
  for (var r = 1; r < rows.length; r++) {
    var m = newMatter(), rec = {};
    header.forEach(function(h, i) { rec[h] = (rows[r][i] || '').trim(); });
    if (!rec.Attorney_Name && !rec.Matter_ID) { skipped++; continue; }
    m.Matter_ID = rec.Matter_ID || '';
    m.Attorney_Name = rec.Attorney_Name || '';
    m.Matter_Type = MATTER_TYPES.indexOf(rec.Matter_Type) >= 0 ? rec.Matter_Type : MATTER_TYPES[0];
    m.Difficulty_Band = DIFFICULTY_BANDS.indexOf(rec.Difficulty_Band) >= 0 ? rec.Difficulty_Band : DIFFICULTY_BANDS[0];
    m.Open_Date = rec.Open_Date || '';
    m.Close_Date = rec.Close_Date || '';
    NUM_KEYS.forEach(function(k) { m[k] = Math.max(0, num((rec[k] || '').replace(/[^0-9.\-]/g, ''))); });
    m.Duration_Days = calcDuration(m.Open_Date, m.Close_Date);
    matters.push(m); added++;
  }
  saveToDisk();
  render();
  showMsg('Imported ' + added + ' matter' + (added === 1 ? '' : 's') + (skipped ? ' (' + skipped + ' blank row' + (skipped === 1 ? '' : 's') + ' skipped)' : '') + '.', true);
}

document.getElementById('file-input').addEventListener('change', function(e) {
  var f = e.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function() { importCSVText(String(reader.result)); };
  reader.onerror = function() { showMsg('Could not read that file.', false); };
  reader.readAsText(f);
  e.target.value = '';
});

// === Init ===
loadFromDisk();
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
