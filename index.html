<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7f6;color:#333;font-size:13px}

.hdr h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.5px}
.hdr p{margin:2px 0 0;font-size:11px;opacity:.75}
.btn{padding:5px 12px;background:#1B4D3E;color:#fff;border:none;border-radius:5px;font-weight:600;font-size:11px}

.btn-ghost{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px}

.del-btn{background:none;border:none;color:#c0392b;font-size:15px;font-weight:700;padding:2px 5px}

.section{margin-bottom:20px;border:1px solid #e2e6ec;border-radius:8px;overflow:hidden}
.section-hdr{background:#1B4D3E;color:#fff;padding:7px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.collapse-btn{width:100%;padding:10px 16px;background:#fff;border:1px solid #e2e6ec;border-radius:8px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#1B4D3E;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.collapse-btn.open{border-radius:8px 8px 0 0}
.collapse-body{background:#fff;border:1px solid #e2e6ec;border-top:none;border-radius:0 0 8px 8px;padding:16px}
.band{color:#fff;border-radius:4px;padding:2px 8px;font-weight:700;display:inline-block;font-size:10px}
.role-cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;max-width:960px;margin:0 auto}
.role-card{width:280px;min-height:240px;padding:32px 24px 24px;background:#fff;border:2px solid #e2e6ec;border-radius:12px;text-align:left;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:border-color .15s,box-shadow .15s}

.msg-err{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}

<body>
<div id="app"></div>
<script>
"use strict";
/* GRM SEARCH — APR Calculator (Standalone HTML, localStorage) */

// ── Constants ───────────────────────────────────────────────────
const ROLES=[''+'Litigator','Transactional','In-house'];
const PRACTICE_AREAS=['Commercial Litigation','Employment Dispute','Regulatory Investigation','Appeal','Contract Dispute','Class Action','Injunction / Interim Relief','Arbitration','M&A','Capital Markets','Real Estate','IP / Technology','Corporate Advisory','Compliance','Insurance','Tax'];
const COMPLEXITY_BANDS=['Low','Medium','High'];
const MATTER_STATUSES=['Open','Closed'];
const ERROR_SEVERITIES=['Minor','Significant','Critical'];
const YES_NO=['Yes','No'];
const YES_NO_PARTIAL=['Yes','No','Partial'];
const SENIORITY_LEVELS=['Junior','Mid-level','Senior','Partner'];
const APR_BANDS=[{l:'Elite',m:120},{l:'Strong',m:100},{l:'Good',m:85},{l:'Fair',m:70},{l:'Weak',m:50},{l:'Poor',m:0}];
const BAND_COL={Elite:'#1a237e',Strong:'#27ae60',Good:'#2196f3',Fair:'#f39c12',Weak:'#e67e22',Poor:'#c0392b','Insufficient data':'#7f8c8d','Insufficient Data':'#7f8c8d'};
const ALL='All',MIN_AUTO=5;
const BT=[
  {key:'peerMedianDays',label:'Peer Median Days (CTE)',desc:'PA+CB+Jur',sJ:1,sP:1,sC:1,roles:['Litigator'],unit:'days'},
  {key:'peerMedianCycle',label:'Peer Median Cycle (TE)',desc:'PA+CB',sJ:0,sP:1,sC:1,roles:['Transactional'],unit:'days'},
  {key:'peerMedianDealValue',label:'Peer Median Deal Value (CADV)',desc:'PA+CB',sJ:0,sP:1,sC:1,roles:['Transactional'],unit:'R'},
  {key:'targetCycleDays',label:'Target Cycle Days (MCE)',desc:'PA',sJ:0,sP:1,sC:0,roles:['In-house'],unit:'days'},
  {key:'normalisationSchedule',label:'Normalisation Schedule (CADV)',desc:'CB+Jur',sJ:1,sP:0,sC:1,roles:['Transactional'],unit:'R'},
];

// ── State ───────────────────────────────────────────────────────
let S={
  role:null,tab:'Matters',benchOpen:false,msg:null,
  mm:{Litigator:[],Transactional:[],'In-house':[]},
  bm:{peerMedianDays:[],peerMedianCycle:[],peerMedianDealValue:[],targetCycleDays:[],normalisationSchedule:[]},
  sl:{practiceAreas:[...PRACTICE_AREAS],complexityBands:[...COMPLEXITY_BANDS],jurisdictions:['Gauteng','Western Cape','KwaZulu-Natal','Eastern Cape','Free State','Limpopo','Mpumalanga','North West','Northern Cape']},
};
let _id=0;const mkId=()=>`id-${++_id}-${Date.now()}`;

// ── Storage ─────────────────────────────────────────────────────
function save(){try{for(const r of ROLES)localStorage.setItem('grm-m-'+r,JSON.stringify(S.mm[r]));localStorage.setItem('grm-bm',JSON.stringify(S.bm));localStorage.setItem('grm-sl',JSON.stringify(S.sl))}catch(e){}}
function load(){try{for(const r of ROLES){const d=localStorage.getItem('grm-m-'+r);if(d)S.mm[r]=JSON.parse(d)}const b=localStorage.getItem('grm-bm');if(b)S.bm=JSON.parse(b);const l=localStorage.getItem('grm-sl');if(l)S.sl=JSON.parse(l)}catch(e){}}

// ── Helpers ─────────────────────────────────────────────────────
function h(t,a,...c){const e=document.createElement(t);if(a)for(const[k,v]of Object.entries(a)){if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='className')e.className=v;else if(k==='value')e.value=v??'';else if(k==='disabled'){if(v)e.setAttribute('disabled','');} else e.setAttribute(k,v)}for(const x of c.flat())if(x!=null)e.append(typeof x==='string'||typeof x==='number'?document.createTextNode(String(x)):x);return e}
const esc=v=>{const s=String(v??'');return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:s};
function calcDur(o,c){if(!o||!c)return 0;const d=(new Date(c)-new Date(o))/864e5;return d>0?Math.round(d):0}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function med(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function getBand(apr){for(const b of APR_BANDS)if(apr>=b.m)return b.l;return'Poor'}
function dlCSV(name,csv){const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function parseLine(line){const f=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else{if(ch==='"')q=true;else if(ch===','){f.push(c.trim());c=''}else c+=ch}}f.push(c.trim());return f}

// ── Benchmark Lookup ────────────────────────────────────────────
function lookupBM(entries,pa,cb,jur){
  const ex=entries.find(e=>e.Practice_Area===pa&&(!cb||e.Complexity_Band===cb)&&(!jur||e.Jurisdiction===jur));
  if(ex&&ex.Value!=null)return ex.Value;
  const cands=entries.filter(e=>{const pO=e.Practice_Area===pa||e.Practice_Area===ALL||(!pa&&!e.Practice_Area);const cO=!cb||e.Complexity_Band===cb||e.Complexity_Band===ALL||!e.Complexity_Band;const jO=!jur||e.Jurisdiction===jur||e.Jurisdiction===ALL||!e.Jurisdiction;return pO&&cO&&jO});
  const sc=e=>{let s=0;if(e.Practice_Area===pa)s+=4;else if(e.Practice_Area===ALL)s+=1;if(e.Complexity_Band===cb)s+=4;else if(e.Complexity_Band===ALL)s+=1;if(jur&&e.Jurisdiction===jur)s+=4;else if(e.Jurisdiction===ALL)s+=1;return s};
  cands.sort((a,b)=>sc(b)-sc(a));const best=cands.find(c=>c.Value!=null);return best?best.Value:null;
}
function calcNDV(dv,cb,jur){const f=lookupBM(S.bm.normalisationSchedule,'',cb,jur);return(!f||f===0)?dv:dv*f}

// ── Missing Benchmark Check ─────────────────────────────────────
function missBM(m,role){
  const pa=m.Practice_Area,cb=m.Complexity_Band,jur=m.Jurisdiction;if(!pa&&!cb&&!jur)return[];
  const miss=[],A=ALL;
  const has=(ent,cP,cC,cJ)=>ent.some(e=>(!cP||e.Practice_Area===pa||e.Practice_Area===A)&&(!cC||e.Complexity_Band===cb||e.Complexity_Band===A)&&(!cJ||e.Jurisdiction===jur||e.Jurisdiction===A));
  if(role==='Litigator'){if(pa&&cb&&jur&&!has(S.bm.peerMedianDays,1,1,1))miss.push(`No Peer Median Days for ${pa}/${cb}/${jur}`)}
  else if(role==='Transactional'){if(pa&&cb&&!has(S.bm.peerMedianCycle,1,1,0))miss.push(`No Peer Median Cycle for ${pa}/${cb}`);if(pa&&cb&&!has(S.bm.peerMedianDealValue,1,1,0))miss.push(`No Peer Median Deal Value for ${pa}/${cb}`);if(cb&&jur&&!has(S.bm.normalisationSchedule,0,1,1))miss.push(`No Normalisation for ${cb}/${jur}`)}
  else{if(pa&&!has(S.bm.targetCycleDays,1,0,0))miss.push(`No Target Cycle Days for ${pa}`)}
  return miss;
}
function totalNV(role){return BT.filter(t=>t.roles.includes(role)).reduce((s,t)=>s+S.bm[t.key].filter(e=>e.Value==null).length,0)}

// ── Scorecard Engine ────────────────────────────────────────────
function computeScorecard(allM,role){
  const end=new Date(),start=new Date(end);start.setFullYear(start.getFullYear()-1);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const rpL=`${fmt(start)} to ${fmt(end)}`;
  const rM=allM.filter(m=>m.role===role);
  const isQ=m=>{if(m.Matter_Status!=='Closed'||!m.Close_Date||!m.Attorney_Name.trim())return false;const c=new Date(m.Close_Date);return c>=start&&c<=end};
  const hasF=m=>{if(!m.Matter_ID||!m.Attorney_Name.trim()||!m.Practice_Area||!m.Complexity_Band||!m.Jurisdiction||!m.Seniority||!m.Open_Date||!m.Close_Date)return false;if(m.role==='Litigator'&&(!m.Expected_Outcome_Value||!m.Actual_Outcome_Value||!m.Budgeted_Net_Value||!m.Actual_Spend))return false;if(m.role==='Transactional'&&(!m.Lead_Attorney||!m.Completed_Without_Rework||!m.Deal_Value))return false;if(m.role==='In-house'&&(!m.Business_Objective||!m.Business_Objective_Met||!m.Resolved_Inhouse))return false;return true};
  const qual=rM.filter(m=>isQ(m)&&hasF(m));
  const grp={},aBA={};
  for(const m of qual){const n=m.Attorney_Name.trim();(grp[n]??=[]).push(m)}
  for(const m of rM.filter(isQ)){const n=m.Attorney_Name.trim();(aBA[n]??=[]).push(m)}
  const aD=qual.map(m=>m.Duration_Days).filter(d=>d>0),pMD=med(aD);
  const minT=role==='In-house'?20:10,now=new Date().toISOString();
  const cntErr=ms=>ms.reduce((s,m)=>m.Error_Disputed==='Yes'?s:s+m.Errors_Count,0);
  const scores=Object.entries(grp).map(([name,ms])=>{
    const n=ms.length,aA=aBA[name]||ms,mP=aA.length?(aA.length-n)/aA.length:0;
    const err=cntErr(ms),w=[];let K1=0,K2=0,K3=0,K4=0,l1='',l2='',l3='',l4='';
    if(role==='Litigator'){l1='LOI';l2='CTE';l3='BPI';l4='PER';const sA=ms.reduce((s,m)=>s+m.Actual_Outcome_Value,0),sE=ms.reduce((s,m)=>s+m.Expected_Outcome_Value,0);K1=sE?sA/sE:0;const avg=n?ms.reduce((s,m)=>s+m.Duration_Days,0)/n:0;let bS=0,bC=0;for(const m of ms){const bv=lookupBM(S.bm.peerMedianDays,m.Practice_Area,m.Complexity_Band,m.Jurisdiction);if(bv!=null){bS+=bv;bC++}else w.push(`Missing peer median days for ${m.Practice_Area}/${m.Complexity_Band}/${m.Jurisdiction}`)}const aB=bC?bS/bC:pMD;if(!bC&&pMD)w.push('No benchmark for CTE — using peer median');K2=avg>0?aB/avg:0;const sB=ms.reduce((s,m)=>s+m.Budgeted_Net_Value,0),sS=ms.reduce((s,m)=>s+m.Actual_Spend,0);K3=sS?sB/sS:0;K4=n?err/n:0}
    else if(role==='Transactional'){l1='CQR';l2='TE';l3='CADV';l4='DER';const led=ms.filter(m=>m.Lead_Attorney==='Yes'),nR=led.filter(m=>m.Completed_Without_Rework==='Yes').length;K1=led.length?nR/led.length:0;const avg=n?ms.reduce((s,m)=>s+m.Duration_Days,0)/n:0;let bS=0,bC=0;for(const m of ms){const bv=lookupBM(S.bm.peerMedianCycle,m.Practice_Area,m.Complexity_Band);if(bv!=null){bS+=bv;bC++}else w.push(`Missing peer median cycle for ${m.Practice_Area}/${m.Complexity_Band}`)}const aB=bC?bS/bC:pMD;if(!bC&&pMD)w.push('No benchmark for TE — using peer median');K2=avg>0?aB/avg:0;const nv=ms.map(m=>calcNDV(m.Deal_Value,m.Complexity_Band,m.Jurisdiction)).filter(v=>v>0),aN=nv.length?nv.reduce((a,b)=>a+b,0)/nv.length:0;let dS=0,dC=0;for(const m of ms){const bv=lookupBM(S.bm.peerMedianDealValue,m.Practice_Area,m.Complexity_Band);if(bv!=null){dS+=bv;dC++}else w.push(`Missing peer median deal value for ${m.Practice_Area}/${m.Complexity_Band}`)}const aD2=dC?dS/dC:0;K3=aD2?aN/aD2:0;K4=n?err/n:0}
    else{l1='BER';l2='MCE';l3='SLI';l4='PRER';K1=n?ms.filter(m=>m.Business_Objective_Met==='Yes').length/n:0;const avg=n?ms.reduce((s,m)=>s+m.Duration_Days,0)/n:0;let bS=0,bC=0;for(const m of ms){const bv=lookupBM(S.bm.targetCycleDays,m.Practice_Area,'','');if(bv!=null){bS+=bv;bC++}else w.push(`Missing target cycle for ${m.Practice_Area}`)}const aB=bC?bS/bC:pMD;if(!bC&&pMD)w.push('No benchmark for MCE — using peer median');K2=avg>0?aB/avg:0;K3=n?ms.filter(m=>m.Resolved_Inhouse==='Yes').length/n:0;if(!w.includes('SLI placeholder — to be confirmed'))w.push('SLI placeholder — to be confirmed');K4=n?err/n:0}
    const a=clamp((K1-.7)*3.5,0,2.375),b=clamp((K2-.6)*2.7,0,2.375),c=clamp((K3-.5)*2.5,0,2.375),d=clamp(2.375-K4*12,0,2.375);
    const APR=Math.round((a+b+c+d)/6*1000)/10;
    const lC=role==='Transactional'?ms.filter(m=>m.Lead_Attorney==='Yes').length:n;
    const mT=lC>=minT,dQ=mP>.2;
    let band,mS,dF;
    if(!mT){band='Insufficient data';mS='No';dF=`Below minimum (${lC}/${minT})`}else if(dQ){band='Insufficient Data';mS='Yes';dF=`>${Math.round(mP*100)}% missing fields`}else{band=getBand(APR);mS='Yes';dF=''}
    return{Attorney_Name:name,Role:role,Matter_Count:n,KPI1:K1,KPI2:K2,KPI3:K3,KPI4:K4,KPI1_Label:l1,KPI2_Label:l2,KPI3_Label:l3,KPI4_Label:l4,a,b,c,d,APR,Band:band,Percentile:null,Meets_Threshold:mS,Data_Quality_Flag:dF,Review_Period:rpL,Peer_Group:`${role} attorneys`,Last_Calculated:now,Benchmark_Warnings:[...new Set(w)]};
  });
  const scored=scores.filter(s=>s.Meets_Threshold==='Yes');
  if(scored.length){const sorted=[...scored].sort((a,b)=>a.APR-b.APR);for(const s of scored)s.Percentile=Math.round(sorted.filter(x=>x.APR<s.APR).length/scored.length*1000)/1000}
  return scores.sort((a,b)=>b.APR-a.APR);
}

// ── CSV Import (Matters) ────────────────────────────────────────
function importMattersCSV(text,role){
  text=text.replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!l.trim().startsWith('#')&&!l.trim().startsWith('"#'));
  if(lines.length<2)return{matters:[],errors:['Empty']};
  const hdrs=parseLine(lines[0]).map(h=>h.trim()),matters=[];
  for(let i=1;i<lines.length;i++){
    const vals=parseLine(lines[i]);if(vals.every(v=>!v.trim()))continue;
    const r={};hdrs.forEach((h,idx)=>r[h]=vals[idx]??'');
    const base={id:mkId(),role,Matter_ID:r.Matter_ID||'',Attorney_Name:r.Attorney_Name||'',Practice_Area:r.Practice_Area||'',Complexity_Band:r.Complexity_Band||'',Jurisdiction:r.Jurisdiction||'',Seniority:SENIORITY_LEVELS.includes(r.Seniority)?r.Seniority:'Junior',Open_Date:r.Open_Date||'',Close_Date:r.Close_Date||'',Duration_Days:calcDur(r.Open_Date,r.Close_Date),Matter_Status:MATTER_STATUSES.includes(r.Matter_Status)?r.Matter_Status:'Open',Errors_Count:parseInt(r.Errors_Count)||0,Error_Type:r.Error_Type||'',Error_Severity:ERROR_SEVERITIES.includes(r.Error_Severity)?r.Error_Severity:'',Error_Disputed:YES_NO.includes(r.Error_Disputed)?r.Error_Disputed:''};
    let m;
    if(role==='Litigator')m={...base,Expected_Outcome_Value:parseFloat(r.Expected_Outcome_Value)||0,Actual_Outcome_Value:parseFloat(r.Actual_Outcome_Value)||0,Budgeted_Net_Value:parseFloat(r.Budgeted_Net_Value)||0,Actual_Spend:parseFloat(r.Actual_Spend)||0};
    else if(role==='Transactional'){m={...base,Lead_Attorney:YES_NO.includes(r.Lead_Attorney)?r.Lead_Attorney:'No',Completed_Without_Rework:YES_NO.includes(r.Completed_Without_Rework)?r.Completed_Without_Rework:'No',Deal_Value:parseFloat(r.Deal_Value)||0,Normalised_Deal_Value:0};m.Normalised_Deal_Value=calcNDV(m.Deal_Value,m.Complexity_Band,m.Jurisdiction)}
    else m={...base,Business_Objective:r.Business_Objective||'',Business_Objective_Met:YES_NO_PARTIAL.includes(r.Business_Objective_Met)?r.Business_Objective_Met:'No',Resolved_Inhouse:YES_NO.includes(r.Resolved_Inhouse)?r.Resolved_Inhouse:'No'};
    matters.push(m);
  }
  return{matters,errors:[]};
}

// ── CSV Export (Matters) ────────────────────────────────────────
function exportMatters(matters,role){
  const common=['Matter_ID','Attorney_Name','Practice_Area','Complexity_Band','Jurisdiction','Seniority','Open_Date','Close_Date','Duration_Days','Matter_Status','Errors_Count','Error_Type','Error_Severity','Error_Disputed'];
  const extra=role==='Litigator'?['Expected_Outcome_Value','Actual_Outcome_Value','Budgeted_Net_Value','Actual_Spend']:role==='Transactional'?['Lead_Attorney','Completed_Without_Rework','Deal_Value','Normalised_Deal_Value']:['Business_Objective','Business_Objective_Met','Resolved_Inhouse'];
  const hdrs=[...common,...extra];
  dlCSV(`${role}_matters.csv`,[hdrs.join(','),...matters.map(m=>hdrs.map(h=>esc(m[h]??'')).join(','))].join('\n'));
}
function exportScorecard(scores){

// ── Benchmark CSV Import/Export ─────────────────────────────────
function exportBenchCSV(t){
  const entries=S.bm[t.key];
  const hdrs=['Practice_Area','Complexity_Band','Jurisdiction','Value'];
  const rows=entries.map(e=>[esc(e.Practice_Area),esc(e.Complexity_Band),esc(e.Jurisdiction),esc(e.Value??'')].join(','));
  dlCSV(`${t.key}_benchmarks.csv`,[hdrs.join(','),...rows].join('\n'));
}
function importBenchCSV(text,t){
  text=text.replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!l.trim().startsWith('#')&&!l.trim().startsWith('"#'));
  if(lines.length<2)return{added:0,upserted:0};
  const hdrs=parseLine(lines[0]).map(h=>h.trim());
  const pI=hdrs.indexOf('Practice_Area'),cI=hdrs.indexOf('Complexity_Band'),jI=hdrs.indexOf('Jurisdiction'),vI=hdrs.indexOf('Value');
  const existing=S.bm[t.key];let added=0,upserted=0;
  for(let i=1;i<lines.length;i++){
    const vals=parseLine(lines[i]);if(vals.every(v=>!v.trim()))continue;
    const pa=(pI>=0?vals[pI]:'')?.trim()??'',cb=(cI>=0?vals[cI]:'')?.trim()??'',jur=(jI>=0?vals[jI]:'')?.trim()??'';
    const raw=vI>=0?vals[vI]?.trim():'',num=raw?parseFloat(raw):null,value=num!=null&&!isNaN(num)?num:null;
    const match=existing.find(e=>(!t.sP||e.Practice_Area===pa)&&(!t.sC||e.Complexity_Band===cb)&&(!t.sJ||e.Jurisdiction===jur));
    if(match){if(value!=null){match.Value=value;upserted++}}
    else{existing.push({id:mkId(),Practice_Area:pa,Complexity_Band:cb,Jurisdiction:jur,Value:value});added++}
  }
  return{added,upserted};
}

// ── Auto-value for benchmark gen ────────────────────────────────
function autoVal(t,pa,cb,jur,rM){
  if(t.key==='normalisationSchedule')return null;
  const match=rM.filter(m=>{if(t.sP&&m.Practice_Area!==pa)return false;if(t.sC&&m.Complexity_Band!==cb)return false;if(t.sJ&&m.Jurisdiction!==jur)return false;return true});
  if(match.length<MIN_AUTO)return null;
  if(t.key==='peerMedianDealValue'){const v=match.map(m=>m.Deal_Value).filter(v=>v>0);return v.length>=MIN_AUTO?Math.round(med(v)*100)/100:null}
  const d=match.map(m=>m.Duration_Days).filter(d=>d>0);return d.length>=MIN_AUTO?Math.round(med(d)*100)/100:null;
}
function genMissing(t){
  const rM=S.mm[S.role],existing=S.bm[t.key],seen=new Set();
  for(const m of rM){
    const pa=t.sP?m.Practice_Area:'',cb=t.sC?m.Complexity_Band:'',jur=t.sJ?m.Jurisdiction:'';
    if(t.sP&&!pa||t.sC&&!cb||t.sJ&&!jur)continue;
    const k=`${pa}|${cb}|${jur}`;if(seen.has(k))continue;seen.add(k);
    if(existing.some(e=>(!t.sP||e.Practice_Area===pa)&&(!t.sC||e.Complexity_Band===cb)&&(!t.sJ||e.Jurisdiction===jur)))continue;
    existing.push({id:mkId(),Practice_Area:pa,Complexity_Band:cb,Jurisdiction:jur,Value:autoVal(t,pa,cb,jur,rM)});
  }
}

  if(!scores.length){card.append(h('div',{style:{textAlign:'center',color:'#888',padding:'32px'}},'Enter closed matters with attorney names to see the scorecard.'));return card}
  const s0=scores[0];
  card.append(h('div',{style:{marginBottom:'8px',fontSize:'12px',color:'#555'}},h('strong',null,'Review Period: '),s0.Review_Period,' | ',h('strong',null,'Peer Group: '),s0.Peer_Group,' | ',h('strong',null,'Last: '),new Date(s0.Last_Calculated).toLocaleString()));
  const tbl=h('table',null);
  const ths=['Attorney','#',s0.KPI1_Label,s0.KPI2_Label,s0.KPI3_Label,s0.KPI4_Label,'a','b','c','d','APR','Band','%ile','Thr.','DQ'];
  tbl.append(h('thead',null,h('tr',{className:'tbl-hdr'},...ths.map(t=>h('th',{style:{textAlign:'center'}},t)))));
  const tbody=h('tbody',null);
  const fmt=(v,d=3)=>v.toFixed(d);
  scores.forEach((s,i)=>{
    const tr=h('tr',{style:{background:i%2?'#f8faf9':'#fff'}});
    const nc=h('td',{style:{fontWeight:600,color:'#1B4D3E',textAlign:'left',padding:'5px'}},s.Attorney_Name);
    if(s.Benchmark_Warnings.length)nc.append(h('span',{className:'warn',title:s.Benchmark_Warnings.join('\n'),style:{marginLeft:'4px'}},'⚠'));
    tr.append(nc);
    const tc=v=>h('td',{style:{textAlign:'center',padding:'5px'}},String(v));
    tr.append(tc(s.Matter_Count),tc(fmt(s.KPI1)),tc(fmt(s.KPI2)),tc(fmt(s.KPI3)),tc(fmt(s.KPI4)),tc(fmt(s.a)),tc(fmt(s.b)),tc(fmt(s.c)),tc(fmt(s.d)));
    tr.append(h('td',{style:{textAlign:'center',fontWeight:700,fontSize:'12px',padding:'5px'}},fmt(s.APR,1)));
    tr.append(h('td',{style:{textAlign:'center',padding:'5px'}},h('span',{className:'band',style:{background:BAND_COL[s.Band]||'#7f8c8d'}},s.Band)));
    tr.append(tc(s.Percentile!=null?fmt(s.Percentile):'—'),tc(s.Meets_Threshold==='Yes'?'✅':'❌'));
    tr.append(h('td',{style:{fontSize:'10px',color:s.Data_Quality_Flag?'#e65100':'#27ae60',textAlign:'left',padding:'5px'}},s.Data_Quality_Flag||'✓ OK'));
    tbody.append(tr);
  });
  tbl.append(tbody);card.append(h('div',{className:'overflow-x'},tbl));return card;
}

// ── Settings ────────────────────────────────────────────────────
function renderSettings(){
  const sl=S.sl,card=h('div',{className:'card'});
  card.append(h('h2',{style:{fontSize:'16px',color:'#1B4D3E',marginBottom:'12px'}},'⚙️ Settings'));
  card.append(h('p',{style:{fontSize:'12px',color:'#555',marginBottom:'16px'}},'Manage shared lists for dropdowns across Matter Entry and Benchmark tables. Changes apply to all roles.'));
  const secs=[{key:'practiceAreas',label:'Practice Areas',ph:'e.g. Environmental Law'},{key:'complexityBands',label:'Complexity Bands',ph:'e.g. Very High'},{key:'jurisdictions',label:'Jurisdictions',ph:'e.g. Gauteng'}];
  const grid=h('div',{style:{display:'flex',gap:'16px',flexWrap:'wrap'}});
  secs.forEach(sec=>{
    const c=h('div',{style:{flex:'1 1 220px',minWidth:'200px',border:'1px solid #e2e6ec',borderRadius:'8px',overflow:'hidden'}});
    c.append(h('div',{style:{background:'#1B4D3E',color:'#fff',padding:'7px 12px',fontSize:'12px',fontWeight:700,display:'flex',justifyContent:'space-between'}},h('span',null,sec.label),h('span',{style:{fontSize:'10px',opacity:.8}},sl[sec.key].length)));
    const body=h('div',{style:{padding:'8px',maxHeight:'220px',overflowY:'auto'}});
    if(!sl[sec.key].length)body.append(h('span',{style:{color:'#aaa',fontSize:'11px'}},'No items'));
    sl[sec.key].forEach((v,i)=>body.append(h('span',{className:'tag'},v,h('button',{style:{background:'none',border:'none',cursor:'pointer',color:'#c0392b',fontWeight:700,fontSize:'12px',padding:0},onClick:()=>{sl[sec.key].splice(i,1);R()}},'✕'))));
    c.append(body);
    const row=h('div',{style:{display:'flex',gap:'4px',padding:'6px 8px',borderTop:'1px solid #eee'}});
    const inp=h('input',{style:{flex:1,padding:'4px 6px',border:'1px solid #cdd3dc',borderRadius:'4px',fontSize:'11px'},placeholder:sec.ph});
    const add=()=>{const v=inp.value.trim();if(!v||sl[sec.key].some(x=>x.toLowerCase()===v.toLowerCase()))return;sl[sec.key].push(v);R()};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
    row.append(inp,h('button',{className:'btn btn-sm',onClick:add},'+Add'));
    c.append(row);grid.append(c);
  });
  card.append(grid);return card;
}

load();R();
